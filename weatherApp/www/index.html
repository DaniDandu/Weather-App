<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
        <meta http-equiv="Content-Security-Policy"
            content="
                default-src 'self' data: https://ssl.gstatic.com;
                style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                font-src 'self' https://fonts.gstatic.com;
                script-src 'self' 'unsafe-inline' 'unsafe-eval';
                connect-src 'self' https://api.openweathermap.org;
                img-src 'self' data: content:;
                media-src *;"
                >

        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <script type="module" src="js/script.js"></script>
    </head>
    <body>
        <div class="splash-screen">
            <img src="img/logo.png" alt="App Logo" class="splash-logo">
        </div>
        <div class="menu-sidebar">
            <div class="menu-header">
                <h2>Favorite Cities</h2>
                <span class="material-symbols-outlined close-menu">close</span>
            </div>
            <div class="favorite-cities-list">
                <div class="favorite-item">
                    <span class="material-symbols-outlined">
                        <span class="material-symbols-outlined">
                            place
                            </span>
                    </span>
                    <div class="favotite-city-name">
                        <h3>Bucuresti</h3>
                    </div>
                    <div class="favorite-city-temp">
                        <h4>27 °C</h4>
                    </div>
                </div>
                <div class="favorite-item">
                    <span class="material-symbols-outlined">
                        <span class="material-symbols-outlined">
                            place
                            </span>
                    </span>
                    <div class="favotite-city-name">
                        <h3>Cluj</h3>
                    </div>
                    <div class="favorite-city-temp">
                        <h4>27 °C</h4>
                    </div>
                </div>
                <div class="favorite-item">
                    <span class="material-symbols-outlined">
                        <span class="material-symbols-outlined">
                            place
                            </span>
                    </span>
                    <div class="favotite-city-name">
                        <h3>Constanta</h3>
                    </div>
                    <div class="favorite-city-temp">
                        <h4>27 °C</h4>
                    </div>
                </div>
            </div>
        </div>
        
        <main class="main-container">
            <header class="input-container">
                <input class="city-input" placeholder="Search City" type="text">
                <button class="search-btn">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </header>
            
            <header class="header-top">
                <span class="material-symbols-outlined menu-icon">menu</span>
                <span class="material-symbols-outlined search-icon">search</span>
            </header>
    
            <section class="weather-info">
                <div class="location-date-container">
                    <div class="location">
                        <div class="current-location"><span class="material-symbols-outlined" id="location-icon">
                            location_on
                        </span>
                        <h5 class="regular-txt">Your Location</h5>
                        </div>
                        <h4 class="country-txt"> - </h4>
                        
                    </div>
                    <h5 class="current-date-txt regular-txt"> </h5>
                </div>
    
                <div class="weather-summary-container">
                    <img src="img/weather/clouds.svg" class="weather-summary-img">
                    <div class="weather-summary-info">
                        <h1 class="temp-txt"> - </h1>
                        <h3 class="condition-txt regular-txt"> </h3>
                    </div>
                </div>
    
                <div class="weather-conditions-container">
                    <div class="condition-item">
                        <span class="material-symbols-outlined">
                            <span class="material-symbols-outlined">
                                thermometer
                                </span>
                        </span>
                        <div class="condition-info">
                            <h5 class="regular-txt">Feels Like</h5>
                            <h5 class="feels-value-txt"> - </h5>
                        </div>
                    </div>
    
                    <div class="condition-item">
                        <span class="material-symbols-outlined">
                            cloud
                        </span>
                        <div class="condition-info">
                            <h5 class="regular-txt">Clouds</h5>
                            <h5 class="clouds-value-txt"> - </h5>
                        </div>
                    </div>
                    
                    <div class="condition-item">
                        <span class="material-symbols-outlined">
                            water_drop
                        </span>
                        <div class="condition-info">
                            <h5 class="regular-txt">Humidity</h5>
                            <h5 class="humidity-value-txt"> - </h5>
                        </div>
                    </div>
    
                    <div class="condition-item">
                        <span class="material-symbols-outlined">
                            air
                        </span>
                        <div class="condition-info">
                            <h5 class="regular-txt">Wind</h5>
                            <h5 class="wind-value-txt"> - </h5>
                        </div>
                    </div>
                </div>
    
                <div class="forecast-items-container">
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt"> - </h5>
                        <img src="img/weather/thunderstorm.svg" class="forecast-item-img">
                        <h5 class="forecast-item-temp"> - </h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt"> - </h5>
                        <img src="img/weather/thunderstorm.svg" class="forecast-item-img">
                        <h5 class="forecast-item-temp"> - </h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt"> - </h5>
                        <img src="img/weather/thunderstorm.svg" class="forecast-item-img">
                        <h5 class="forecast-item-temp"> - </h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt"> - </h5>
                        <img src="img/weather/thunderstorm.svg" class="forecast-item-img">
                        <h5 class="forecast-item-temp"> - </h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt"> - </h5>
                        <img src="img/weather/thunderstorm.svg" class="forecast-item-img">
                        <h5 class="forecast-item-temp"> - </h5>
                    </div>
                </div>
    
                <div class="save-location"><button class="save-location-btn">Save Location</button></div>
                
            </section>
        </main>
    
    </body>
</html>
